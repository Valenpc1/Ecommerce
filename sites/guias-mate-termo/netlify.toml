# Sitio estático sin build. Conéctalo una sola vez a este repositorio en Netlify:
#   Base directory: sites/guias-mate-termo · Build command: (vacío) · Publish directory: .
# A partir de ahí, cada push a la rama se publica solo.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos de assets/ y vendor/ llevan versión en el nombre: se pueden guardar un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
